[global]
repo1-type=s3
repo1-path=/twilite/postgres
repo1-retention-full=7
repo1-retention-full-type=time
repo1-retention-diff=28
repo1-retention-archive=14
repo1-bundle=y
repo1-block=y
repo1-cipher-type=aes-256-cbc
repo1-s3-uri-style=path
archive-async=y
archive-check=y
archive-timeout=60
compress-type=zst
compress-level=3
start-fast=y
process-max=1

# Values below are supplied at runtime by the external secret recovery flow.
# No endpoint, access id, cipher material or bucket credential is committed.
repo1-s3-endpoint=${PGBACKREST_S3_ENDPOINT}
repo1-s3-bucket=${PGBACKREST_S3_BUCKET}
repo1-s3-region=${PGBACKREST_S3_REGION}

[twilite]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
