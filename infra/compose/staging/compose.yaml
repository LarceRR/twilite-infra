name: ${STAGE_PROJECT_NAME:-lumi-staging}
services:
  api:
    image: ${API_IMAGE_REPOSITORY:?set immutable GHCR repository}@${API_IMAGE_DIGEST:?set sha256 digest, never latest}
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    environment:
      NODE_ENV: staging
      PORT: "3000"
      DATABASE_URL_FILE: /run/secrets/stage_database_url
      REDIS_URL_FILE: /run/secrets/stage_redis_url
      OPENBAO_ADDR: https://openbao:8200
      OPENBAO_ROLE: staging-api
      STAGING_SMOKE_CREDENTIAL_FILE: /run/secrets/stage_smoke_credential
    secrets: [stage_database_url, stage_redis_url, stage_openbao_token, stage_smoke_credential]
    networks: [stage_net, infra_net]
    mem_limit: 192m
    mem_reservation: 128m
    cpus: "0.25"
    cpu_shares: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      com.twilite.environment: staging
      com.twilite.release: ${RELEASE_SHA:?set release SHA}
      com.twilite.immutable: "true"
networks:
  stage_net: { external: true, name: lumi_stage_net }
  infra_net: { external: true, name: lumi_infra_net }
secrets:
  stage_database_url: { file: ${STAGE_DATABASE_URL_FILE:?set secret file} }
  stage_redis_url: { file: ${STAGE_REDIS_URL_FILE:?set secret file} }
  stage_openbao_token: { file: ${STAGE_OPENBAO_TOKEN_FILE:?set secret file} }
  stage_smoke_credential: { file: ${STAGE_SMOKE_CREDENTIAL_FILE:?set secret file} }
