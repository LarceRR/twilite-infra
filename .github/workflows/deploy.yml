name: deploy

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: immutable GHCR image digest (sha256:...)
        required: true
        type: string
      release_sha:
        description: source commit SHA
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable release
        env:
          API_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: infra/deploy/validate-release.sh
      - name: Install deployment key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/twilite_deploy"
          chmod 600 "$HOME/.ssh/twilite_deploy"
      - name: Copy deployment contract
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/twilite_deploy" infra/deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/twilite-deploy.sh"
      - name: Deploy staging remotely
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY }}
          API_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SMOKE_URL: ${{ secrets.STAGING_SMOKE_URL }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/twilite_deploy" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo install -m 0750 /tmp/twilite-deploy.sh /usr/local/sbin/twilite-deploy && sudo env DEPLOY_ENV=staging API_IMAGE_REPOSITORY='$API_IMAGE_REPOSITORY' API_IMAGE_DIGEST='$API_IMAGE_DIGEST' RELEASE_SHA='$RELEASE_SHA' STATE_DIR=/var/lib/twilite-deploy/staging SMOKE_URL='$SMOKE_URL' /usr/local/sbin/twilite-deploy"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable release
        env:
          API_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: infra/deploy/validate-release.sh
      - name: Install deployment key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/twilite_deploy"
          chmod 600 "$HOME/.ssh/twilite_deploy"
      - name: Copy deployment contract
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/twilite_deploy" infra/deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/twilite-deploy.sh"
      - name: Production approval gate and deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY }}
          API_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SMOKE_URL: ${{ secrets.PRODUCTION_SMOKE_URL }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/twilite_deploy" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo install -m 0750 /tmp/twilite-deploy.sh /usr/local/sbin/twilite-deploy && sudo env DEPLOY_ENV=production API_IMAGE_REPOSITORY='$API_IMAGE_REPOSITORY' API_IMAGE_DIGEST='$API_IMAGE_DIGEST' RELEASE_SHA='$RELEASE_SHA' STATE_DIR=/var/lib/twilite-deploy/production SMOKE_URL='$SMOKE_URL' /usr/local/sbin/twilite-deploy"
