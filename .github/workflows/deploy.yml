name: deploy

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: immutable GHCR image digest (sha256:...)
        required: true
        type: string
      release_sha:
        description: source commit SHA
        required: true
        type: string

tconcurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable release
        env:
          API_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: infra/deploy/validate-release.sh
      - name: Deploy staging
        env:
          DEPLOY_ENV: staging
          API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY }}
          API_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STATE_DIR: /var/lib/twilite-deploy/staging
          SMOKE_URL: ${{ secrets.STAGING_SMOKE_URL }}
        run: infra/deploy/deploy.sh

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable release
        env:
          API_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: infra/deploy/validate-release.sh
      - name: Production approval gate
        run: echo 'GitHub production environment approval is required before this job starts'
      - name: Deploy production
        env:
          DEPLOY_ENV: production
          API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY }}
          API_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STATE_DIR: /var/lib/twilite-deploy/production
          SMOKE_URL: ${{ secrets.PRODUCTION_SMOKE_URL }}
        run: infra/deploy/deploy.sh
