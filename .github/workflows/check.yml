name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Run unit files with diagnostics
        shell: bash
        run: |
          set -uo pipefail
          tests=(test/unit/smoke.test.ts test/unit/vmctl.test.ts test/unit/ssh.test.ts test/unit/os-security.test.ts)
          failed=0
          for test_file in "${tests[@]}"; do
            echo "===== $test_file ====="
            output="$(node --test --test-reporter=spec "$test_file" 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if (( status != 0 )); then
              compact="$(printf '%s' "$output" | tr '\n' ' ' | cut -c1-5000)"
              echo "::error title=Unit failure::$test_file: $compact"
              failed=1
            fi
          done
          exit "$failed"
