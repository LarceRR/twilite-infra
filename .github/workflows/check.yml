name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Run unit files with direct output
        shell: bash
        run: |
          set -uo pipefail
          tests=(test/unit/smoke.test.ts test/unit/vmctl.test.ts test/unit/ssh.test.ts test/unit/os-security.test.ts)
          failed=0
          for test_file in "${tests[@]}"; do
            echo "===== $test_file ====="
            node --test --test-reporter=spec "$test_file" || failed=1
          done
          exit "$failed"
